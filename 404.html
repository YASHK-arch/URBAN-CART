<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UrbanCart</title>
    <script>
      // SPA redirect for GitHub Pages
      // Stores the full path/query/hash and redirects to the app root.
      // The main index.html then reads this and replaces the URL before React boots.
      var l = window.location;
      var segmentCount = 1; // Number of path segments in the repo name (1 for /URBAN-CART/)
      sessionStorage.redirect = l.pathname.slice(
        ('/' + l.pathname.slice(1).split('/').slice(0, segmentCount).join('/')).length
      ) + (l.search || '') + (l.hash || '');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=1'
      );
    </script>
  </head>
  <body></body>
</html>
